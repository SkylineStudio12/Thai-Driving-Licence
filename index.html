<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thai Motorcycle Licence — Theory Trainer</title>
<style>
/* Design system: shadcn/ui (New York, neutral base colour), ported to plain CSS so the app
   stays a single offline file with no build. Tokens mirror shadcn's CSS variables; the old
   names (--ink, --dim, --line, --accent, --ok, --bad, --warn) are kept as aliases because the
   render code uses them in inline styles. */
:root{
  --radius:.625rem;
  --background:#ffffff; --foreground:#0a0a0a;
  --card:#ffffff; --card-foreground:#0a0a0a;
  --primary:#171717; --primary-foreground:#fafafa;
  --secondary:#f5f5f5; --secondary-foreground:#171717;
  --muted:#f5f5f5; --muted-foreground:#737373;
  --accent-bg:#f5f5f5;
  --destructive:#dc2626; --success:#059669; --warning:#d97706;
  --border:#e5e5e5; --input:#e5e5e5; --ring:#a3a3a3;
  --success-bg:#ecfdf5; --destructive-bg:#fef2f2; --warning-bg:#fffbeb;
  --shadow-xs:0 1px 2px 0 rgb(0 0 0 / .05);
  --shadow-sm:0 1px 3px 0 rgb(0 0 0 / .1),0 1px 2px -1px rgb(0 0 0 / .1);
}
@media (prefers-color-scheme:dark){
  :root{
    --background:#0a0a0a; --foreground:#fafafa;
    --card:#171717; --card-foreground:#fafafa;
    --primary:#e5e5e5; --primary-foreground:#171717;
    --secondary:#262626; --secondary-foreground:#fafafa;
    --muted:#262626; --muted-foreground:#a1a1a1;
    --accent-bg:#262626;
    --destructive:#f87171; --success:#34d399; --warning:#fbbf24;
    --border:rgb(255 255 255 / .1); --input:rgb(255 255 255 / .15); --ring:#737373;
    --success-bg:rgb(52 211 153 / .08); --destructive-bg:rgb(248 113 113 / .08); --warning-bg:rgb(251 191 36 / .08);
  }
}
:root{
  --bg:var(--background); --ink:var(--foreground); --dim:var(--muted-foreground); --line:var(--border);
  --accent:var(--primary); --ok:var(--success); --bad:var(--destructive); --warn:var(--warning); --warnbg:var(--warning-bg);
}
*{box-sizing:border-box;border-color:var(--border)}
/* buttons do not inherit colour from the page; without this they render as UA black on dark cards */
button{color:inherit}
a{color:var(--foreground);text-decoration:underline;text-underline-offset:4px;font-weight:500}
a:hover{color:var(--muted-foreground)}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 50%,transparent)}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--background);color:var(--foreground);
  font:15px/1.6 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:780px;margin:0 auto;padding:0 16px}
#view{padding-bottom:calc(96px + env(safe-area-inset-bottom))}

/* ---- page skeleton: top bar (back · title · action) + bottom tab bar ---- */
.topbar{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--border);
  padding-top:env(safe-area-inset-top);
  background:color-mix(in srgb,var(--background) 85%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.topbar-row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;min-height:56px}
.topbar h1{grid-column:2;text-align:center;font-size:16px;font-weight:600;margin:0;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-slot{display:flex}
.tb-slot.end{justify-content:flex-end}
.sub{font-size:13px;color:var(--muted-foreground);margin:0 0 12px}
.icon-btn{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;
  border:1px solid transparent;background:none;color:var(--foreground);
  border-radius:calc(var(--radius) - 2px);cursor:pointer;padding:0}
.icon-btn:hover,.icon-btn[aria-expanded=true]{background:var(--accent-bg)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[hidden]{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
  background:color-mix(in srgb,var(--background) 90%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.tabbar-row{display:flex;max-width:780px;margin:0 auto;padding:0 4px}
.tabbar button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:8px 2px 7px;font:inherit;font-size:11px;font-weight:500;line-height:1.2;
  color:var(--muted-foreground);cursor:pointer;-webkit-tap-highlight-color:transparent}
.tabbar button span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar button svg{width:22px;height:22px;stroke-width:1.75}
.tabbar button:hover{color:var(--foreground)}
.tabbar button[aria-current=page]{color:var(--foreground)}
.tabbar button[aria-current=page] svg{stroke-width:2.25}

/* DropdownMenu / Popover */
.popover{position:fixed;z-index:60;min-width:200px;max-width:calc(100vw - 16px);padding:4px;
  background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:0 4px 6px -1px rgb(0 0 0 / .1),0 2px 4px -2px rgb(0 0 0 / .1);
  animation:pop-in .12s ease-out}
.popover[hidden]{display:none}
@keyframes pop-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.popover{animation:none}}
.popover .label{font-size:12px;font-weight:500;color:var(--muted-foreground);padding:6px 8px 4px}
.popover button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;
  border-radius:calc(var(--radius) - 4px);padding:7px 8px;font:inherit;font-size:14px;color:inherit;cursor:pointer}
.popover button:hover,.popover button:focus-visible{background:var(--accent-bg);box-shadow:none}
.popover button[aria-current=page]{font-weight:600}
.popover button svg{flex:0 0 auto;width:16px;height:16px;color:var(--muted-foreground)}
.popover button.danger,.popover button.danger svg{color:var(--destructive)}

/* Dialog (help) */
dialog.dlg{width:calc(100% - 32px);max-width:480px;max-height:calc(100dvh - 64px);padding:24px;margin:auto;
  background:var(--background);color:var(--foreground);border:1px solid var(--border);
  border-radius:calc(var(--radius) + 2px);box-shadow:0 10px 15px -3px rgb(0 0 0 / .1),0 4px 6px -4px rgb(0 0 0 / .1)}
dialog.dlg::backdrop{background:rgb(0 0 0 / .5)}
dialog.dlg h2{margin:0 32px 8px 0;font-size:18px}
dialog.dlg .dlg-body{font-size:14.5px;color:var(--muted-foreground)}
dialog.dlg .dlg-body p,dialog.dlg .dlg-body li{font-size:14.5px}
dialog.dlg .dlg-body b{color:var(--foreground)}
dialog.dlg .dlg-close{position:absolute;top:12px;right:12px;width:32px;height:32px;opacity:.7}
dialog.dlg .dlg-close:hover{opacity:1}
dialog.dlg .dlg-foot{display:flex;justify-content:flex-end;margin-top:20px}

/* Card */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);
  border-radius:calc(var(--radius) + 4px);padding:20px;margin:16px 0;box-shadow:var(--shadow-xs)}
@media(min-width:640px){.card{padding:24px}}
h2{font-size:16px;font-weight:600;margin:28px 0 10px;letter-spacing:-.015em;line-height:1.35}
h3{font-size:12px;font-weight:500;margin:18px 0 6px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em}
p,li{font-size:15px}
.th{font-size:14.5px;color:var(--muted-foreground);line-height:1.5}

/* Button: default + outline variants */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;
  background:var(--primary);color:var(--primary-foreground);border:1px solid transparent;
  border-radius:calc(var(--radius) - 2px);padding:7px 16px;font:inherit;font-size:14px;font-weight:500;
  cursor:pointer;box-shadow:var(--shadow-xs);transition:background .15s,opacity .15s}
.btn:hover{background:color-mix(in srgb,var(--primary) 90%,transparent)}
.btn.ghost{background:var(--background);color:var(--foreground);border-color:var(--border)}
.btn.ghost:hover{background:var(--accent-bg)}
@media (prefers-color-scheme:dark){.btn.ghost{background:color-mix(in srgb,var(--input) 30%,transparent);border-color:var(--input)}
  .btn.ghost:hover{background:color-mix(in srgb,var(--input) 50%,transparent)}}
.btn:disabled{opacity:.5;cursor:default;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=checkbox]{flex:0 0 auto;width:16px;height:16px;accent-color:var(--primary);margin:0}
label.row{flex-wrap:nowrap;align-items:flex-start;cursor:pointer}
label.row input{margin-top:4px}

/* Answer options: radio-card pattern */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:12px 14px;margin:8px 0;font:inherit;font-size:15px;cursor:pointer;
  box-shadow:var(--shadow-xs);transition:background .15s,border-color .15s}
.opt:hover{background:var(--accent-bg)}
.opt[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}
.opt.right{border-color:var(--success);background:var(--success-bg);box-shadow:0 0 0 1px var(--success)}
.opt.wrong{border-color:var(--destructive);background:var(--destructive-bg);box-shadow:0 0 0 1px var(--destructive)}
.opt b{display:inline-block;min-width:1.4em;color:var(--muted-foreground);font-weight:500}

/* List (item group): icon · label · chevron rows inside a card */
.list{padding:4px;margin:16px 0}
.list button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;
  border-radius:var(--radius);padding:10px;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.list button+button{position:relative}
.list button+button::before{content:"";position:absolute;top:0;left:56px;right:10px;border-top:1px solid var(--border)}
.list button:hover{background:var(--accent-bg)}
.list button:hover::before,.list button:hover+button::before{border-color:transparent}
.list .ico{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:36px;height:36px;
  border-radius:calc(var(--radius) - 2px);background:var(--muted);color:var(--foreground)}
.list .ico svg{width:18px;height:18px}
.list .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.list .txt b{font-weight:500;font-size:15px}
.list .txt span{font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .count{flex:0 0 auto;font-size:13px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.list .chev{flex:0 0 auto;width:16px;height:16px;color:var(--muted-foreground)}

/* Alert */
.why{background:var(--warning-bg);border:1px solid color-mix(in srgb,var(--warning) 35%,transparent);
  padding:12px 14px;border-radius:var(--radius);font-size:14.5px;margin:12px 0 0}
.why b:first-child{color:var(--warning)}
.note{color:var(--warning);font-size:13.5px;margin-top:6px}

/* Progress */
.bar{height:8px;background:color-mix(in srgb,var(--primary) 15%,transparent);border-radius:99px;overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .2s}

/* Badge (outline) */
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:500;line-height:1.4;padding:1px 8px;
  border-radius:calc(var(--radius) - 4px);border:1px solid var(--border);color:var(--foreground);
  vertical-align:middle;white-space:nowrap}
.big{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.ok{color:var(--success)} .bad{color:var(--destructive)}

/* Table */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
@media (hover:hover){tbody tr:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}}
th{color:var(--muted-foreground);font-weight:500;font-size:13px}

/* the sign PNGs are transparent with black glyphs, so they MUST sit on white */
.sign{object-fit:contain;background:#fff;border-radius:var(--radius);padding:5px;display:block;
  border:1px solid var(--border)}

/* Pagination */
.pager{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:16px 0}
.pager button{min-width:36px;min-height:36px;padding:6px 10px;border:1px solid transparent;background:none;
  border-radius:calc(var(--radius) - 2px);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.pager button:hover{background:var(--accent-bg)}
.pager button[aria-current=page]{background:var(--background);border-color:var(--border);box-shadow:var(--shadow-xs)}
@media (prefers-color-scheme:dark){.pager button[aria-current=page]{background:color-mix(in srgb,var(--input) 30%,transparent);border-color:var(--input)}}
.pager button:disabled{opacity:.5;cursor:default;pointer-events:none}
.pager .gap{color:var(--muted-foreground);padding:0 2px}
.pager .count{margin-left:auto;font-size:13px;color:var(--muted-foreground)}
.mono{font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;padding:2px 10px;
  border-radius:calc(var(--radius) - 4px);background:var(--secondary)}
.timer.low{color:var(--destructive);background:var(--destructive-bg)}

/* Accordion */
details{border-bottom:1px solid var(--border);padding:0}
details:last-child{border-bottom:0}
summary{cursor:pointer;font-weight:500;font-size:15px;padding:14px 0;list-style:none;
  display:flex;justify-content:space-between;align-items:center;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:0 0 auto;width:7px;height:7px;margin-right:4px;
  border-right:1.5px solid var(--muted-foreground);border-bottom:1.5px solid var(--muted-foreground);
  transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
summary:hover{text-decoration:underline;text-underline-offset:4px}
details>:not(summary){margin-top:0}
details[open]{padding-bottom:12px}

/* Kbd */
kbd{font:inherit;font-size:12px;font-weight:500;background:var(--muted);color:var(--muted-foreground);
  border-radius:4px;padding:1px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- Page skeleton: every screen gets the same top bar (Back · title · optional action),
     content in #view, and the section tab bar at the bottom. Screens describe themselves
     in PAGES (see the script); the chrome is drawn by renderChrome(). -->
<header class="topbar"><div class="wrap topbar-row">
  <div class="tb-slot"><button class="icon-btn" id="backBtn" aria-label="Back" hidden></button></div>
  <h1 id="pageTitle">Mock exam</h1>
  <div class="tb-slot end" id="tbAction"></div>
</div></header>
<div class="wrap" id="view"></div>
<nav class="tabbar" aria-label="Sections"><div class="tabbar-row" id="tabs"></div></nav>
<div class="popover" id="popover" role="menu" hidden></div>
<dialog class="dlg" id="helpDlg" aria-labelledby="helpTitle">
  <h2 id="helpTitle"></h2>
  <div class="dlg-body" id="helpBody"></div>
  <div class="dlg-foot"><button class="btn" id="helpOk">Got it</button></div>
  <button class="icon-btn dlg-close" id="helpClose" aria-label="Close"></button>
</dialog>

<script src="bank.js"></script>
<script src="signs.js"></script>
<script>
const CATS = {
  veh:  ['Vehicle law',   'กฎหมายว่าด้วยรถยนต์'],
  trf:  ['Traffic law',   'กฎหมายว่าด้วยจราจรทางบก'],
  sign: ['Signs',         'เครื่องหมายจราจร'],
  mark: ['Road markings', 'เครื่องหมายจราจรบนพื้นทาง'],
  alco: ['Alcohol & drugs', 'แอลกอฮอล์และยาเสพติด'],
  fit:  ['Fitness to ride', 'ความพร้อมของผู้ขับขี่'],
  aid:  ['First aid',       'การปฐมพยาบาล'],
  etq:  ['Etiquette',     'มารยาทและจิตสำนึก'],
  safe: ['Safe riding',   'เทคนิคการขับขี่อย่างปลอดภัย'],
  maint:['Maintenance',   'การบำรุงรักษารถ'],
  moto: ['Motorcycle',    'รถจักรยานยนต์'],
  proc: ['Exam & process','ขั้นตอนการสอบ']
};
/* Lucide icon per category, shown in the Study list */
const CAT_ICON = {veh:'scale', trf:'route', sign:'triangle-alert', mark:'road', alco:'wine', fit:'heart-pulse', aid:'briefcase-medical', etq:'handshake', safe:'shield-check', maint:'wrench', moto:'motorbike', proc:'list-checks'};
/* how many of each the mock aims for — shaped after the real 50-question paper */
const QUOTA = {veh:7, trf:9, sign:8, mark:3, etq:5, safe:4, maint:4, moto:3, proc:2, alco:2, fit:2, aid:1};
const KEY = 'thai-moto-progress';
const PASS = 45, TOTAL = 50, MINUTES = 60;

const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const save = a => localStorage.setItem(KEY, JSON.stringify(a));
const el = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- paging (Study and Signs) ---------- */
const PAGE_SIZE = {study: 6, signs: 12};   // Study cards are tall, sign cards are short
const pageNo = {study: 1, signs: 1};
/* page numbers to show: first, last, and the current page with one neighbour each side */
const pageWindow = (cur, pages) =>
  [...new Set([1, cur-1, cur, cur+1, pages].filter(n => n >= 1 && n <= pages))].sort((a, b) => a - b);
const pageCount = (total, size) => Math.max(1, Math.ceil(total / size));
const pageSlice = (arr, page, size) => arr.slice((page-1)*size, page*size);

/* ---------- merge signs into the bank ----------
   A sign question's three wrong options are drawn from the SAME family first
   (no-U-turn against no-right-turn, no parking against no stopping, max speed
   against min speed) and only then from the wider set. That is what makes the
   confusable pairs the thing being tested. Regenerated on every paper, so the
   position of the right answer is never learnable. */
/* Families are the GALLERY grouping. For distractors, tiny families are merged into a
   bigger pool — a 2-member family would otherwise fall through to unrelated signs and
   hand you the answer (a gradient sign against a speed limit is no test at all).
   Every group must hold at least 4 signs; the self-test enforces that. */
const FAM_GROUP = {gradient:'road', surface:'road', uturn:'laneflow',
                   endzone:'prohibit', rail:'aheadwarn', divert:'workwarn'};
const gkey = s => FAM_GROUP[s.fam] || s.fam;
const SIGN_GRP = {};
SIGNS.forEach(s => (SIGN_GRP[gkey(s)] = SIGN_GRP[gkey(s)] || []).push(s));

function signOpts(s){
  const sibs  = shuffle(SIGN_GRP[gkey(s)].filter(x => x.en !== s.en));
  const wider = shuffle(SIGNS.filter(x => gkey(x) !== gkey(s) && x.en !== s.en));
  const picks = [], seen = new Set([s.en]);
  for (const c of sibs.concat(wider)){
    if (picks.length === 3) break;
    if (seen.has(c.en)) continue;
    seen.add(c.en); picks.push(c);
  }
  const opts = shuffle([s].concat(picks));
  return {o: opts.map(x => [x.th, x.en]), a: opts.indexOf(s)};
}

/* gallery:true signs are shown for recognition but never asked — the eighteen
   เบี่ยงเบนการจราจร diamonds all mean the same thing, so asking each one separately
   would be padding, and inventing a distinct answer for each would be fiction. */
SIGNS.filter(s => !s.gallery).forEach(s => {
  const q = {c:'sign', img:s.img, code:s.code, sign:s, w:s.w,
             en:'What does this sign mean?', th:'เครื่องหมายนี้หมายความว่าอย่างไร'};
  Object.assign(q, signOpts(s));
  BANK.push(q);
});
BANK.forEach((q,i) => q.id = i);

let showThai = true;              // bilingual by default
let excludeCarOnly = true;        // car-only items are off the motorcycle paper
let tab = 'mock';
let exam = null;                  // {qs, pick[], started, deadline, submitted}

/* ---------- shell ---------- */
/* Lucide icons (lucide.dev, ISC licence), inlined from lucide-static 1.73.0 so the app stays offline */
const LUCIDE = {
  'clipboard-check': '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  'book-open': '<path d="M12 5v16"/><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"/>',

const lucide = n => `<svg class="lucide lucide-${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${LUCIDE[n]}</svg>`;
/* ---- PAGES: one entry per section. To add a page: give it a key, a title, a Lucide icon
   and a view(v) that fills the content area. meta() is optional and returns per-screen extras:
     title  - overrides the top-bar title (e.g. while a paper is running)
     help   - {title, body} adds a help button (circle-help) on the right that opens a dialog
     menu   - [{label, icon, run, danger}] adds a kebab button on the right with those actions
   The tab bar lists PAGES in this order; whatever does not fit goes under "More". */
const PAGES = {
  mock: {title:'Mock exam', icon:'clipboard-check', view: v => viewMock(v), meta: () =>
    exam && !exam.submitted ? {title:`Paper · ${exam.i+1} of ${exam.qs.length}`, menu:[
      {label: showThai ? 'Hide Thai text' : 'Show Thai text', icon:'languages', run: () => { showThai = !showThai; render(); }},

          <li>Picking an answer moves you to the next question; use Previous to change it.</li>

    ? {title: CATS[studyCat][0], menu:[

/* ---- navigation: each screen is a browser-history entry {tab, sub, d}, so Back (top bar,
   browser or phone gesture) returns to the previous screen. d = depth; Back hides at 0. */
const navState = () => history.state || {tab, d:0};
function go(k){
  closePopover();
  const atRoot = !(k === 'study' && studyCatOpen());
  if (k === tab && atRoot && !(k === 'mock' && exam && exam.submitted)) { scrollTo(0,0); return; }
  if (k === 'mock' && exam && exam.submitted) exam = null;   // a finished paper is not resumed
  const sub = k === 'mock' && exam && !exam.submitted ? 'exam' : undefined;   // a running paper keeps going
  history.pushState({tab:k, sub, d:navState().d + 1}, '', '#' + k);
  tab = k; render(); scrollTo(0,0);
}
function beginExam(ids){
  const st = {tab:'mock', sub:'exam', d:navState().d + (navState().sub === 'result' ? 0 : 1)};
  if (navState().sub === 'result') history.replaceState(st, '', '#mock');
  else history.pushState(st, '', '#mock');
  tab = 'mock'; startExam(ids); scrollTo(0,0);
}
function finishExam(){
  history.replaceState({...navState(), sub:'result'}, '', location.hash);
  submit(); scrollTo(0,0);
}
function leaveExam(){
  if (exam && !exam.submitted && !confirm('Leave this paper? Your answers will be lost.')) return;
  if (navState().sub && navState().d > 0) { exam = exam && {...exam, submitted:true, left:true}; history.back(); return; }
  exam = null; history.replaceState({tab:'mock', d:navState().d}, '', '#mock'); render();
}
function clearHistory(){
  const h = load();
  if (confirm('Delete all '+h.length+' recorded attempts? This cannot be undone.')) { localStorage.removeItem(KEY); render(); }
}
addEventListener('popstate', e => {
  closePopover();
  const s = e.state || {tab:'mock', d:0};
  const toExam = s.tab === 'mock' && s.sub === 'exam';
  if (exam && !exam.submitted && s.tab === 'mock' && !toExam) {
    if (!confirm('Leave this paper? Your answers will be lost.')) {
      history.pushState({tab:'mock', sub:'exam', d:s.d + 1}, '', '#mock'); return;
    }
    exam = null;
  }
  if (exam && exam.submitted && s.tab === 'mock' && s.sub !== 'result') exam = null;
  tab = s.tab; render(); scrollTo(0,0);
});

/* ---- popover (shadcn DropdownMenu): used by the kebab menu and the tab bar's More */
let popAnchor = null;
function openPopover(anchor, items, where){
  const pop = document.getElementById('popover');
  if (popAnchor === anchor) { closePopover(); return; }
  closePopover();
  pop.innerHTML = '';
  items.forEach(it => {
    if (it.heading) { pop.appendChild(el(`<div class="label">${it.heading}</div>`)); return; }
    const b = el(`<button role="menuitem" class="${it.danger ? 'danger' : ''}">${lucide(it.icon)}<span>${esc(it.label)}</span></button>`);
    if (it.current) b.setAttribute('aria-current', 'page');
    b.onclick = () => { closePopover(true); it.run(); };
    pop.appendChild(b);
  });
  pop.hidden = false;
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  pop.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  pop.style.top = (where === 'above' ? r.top - h - 6 : r.bottom + 6) + 'px';
  pop.style.transformOrigin = where === 'above' ? 'bottom right' : 'top right';
  popAnchor = anchor; anchor.setAttribute('aria-expanded', 'true');
  (pop.querySelector('[aria-current]') || pop.querySelector('button')).focus();
}
function closePopover(keepFocus){
  if (!popAnchor) return;
  document.getElementById('popover').hidden = true;
  popAnchor.setAttribute('aria-expanded', 'false');
  if (!keepFocus && document.body.contains(popAnchor)) popAnchor.focus();
  popAnchor = null;
}
document.addEventListener('pointerdown', e => {
  if (popAnchor && !e.target.closest('#popover') && !popAnchor.contains(e.target)) closePopover(true);
});
document.addEventListener('keydown', e => {
  if (!popAnchor) return;
  if (e.key === 'Escape') { e.preventDefault(); closePopover(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const f = [...document.querySelectorAll('#popover button')], i = f.indexOf(document.activeElement);
    f[(i + (e.key === 'ArrowDown' ? 1 : -1) + f.length) % f.length].focus();
  }
});
addEventListener('resize', () => { closePopover(true); renderTabs(); });

/* ---- help dialog (shadcn Dialog), native <dialog> for focus trapping and Escape */
const helpDlg = document.getElementById('helpDlg');
function openHelp(h){
  document.getElementById('helpTitle').textContent = h.title;
  document.getElementById('helpBody').innerHTML = h.body;
  helpDlg.showModal();
}
document.getElementById('helpClose').innerHTML = lucide('x');
document.getElementById('helpClose').onclick = () => helpDlg.close();

/* ---- chrome: top bar + tab bar */
const backBtn = document.getElementById('backBtn');
backBtn.innerHTML = lucide('chevron-left');
/* a sub-page opened straight from a link has nothing behind it, so Back goes up to its parent instead */
const canGoUp = () => studyCatOpen();
backBtn.onclick = () => {
  if (navState().d > 0) { history.back(); return; }
  if (studyCatOpen()) { history.replaceState({tab:'study', d:0}, '', '#study'); render(); scrollTo(0,0); }
};
function renderChrome(){
  const page = PAGES[tab], meta = (page.meta && page.meta()) || {};
  const title = meta.title || page.title;
  document.getElementById('pageTitle').textContent = title;
  document.title = `${title} · Thai Motorcycle Licence`;
  backBtn.hidden = !(navState().d > 0 || canGoUp());
  const slot = document.getElementById('tbAction');
  slot.innerHTML = '';
  if (meta.menu && meta.menu.length) {
    const b = el(`<button class="icon-btn" aria-label="More actions" aria-haspopup="menu" aria-expanded="false">${lucide('ellipsis-vertical')}</button>`);
    b.onclick = () => openPopover(b, meta.menu, 'below');
    slot.appendChild(b);
  } else if (meta.help) {
    const b = el(`<button class="icon-btn" aria-label="Help" aria-haspopup="dialog">${lucide('circle-help')}</button>`);
    b.onclick = () => openHelp(meta.help);
    slot.appendChild(b);
  }
  renderTabs();
}
const TAB_MIN_WIDTH = 72;   // px per tab-bar item; below this the labels stop being readable
function renderTabs(){
  const row = document.getElementById('tabs');
  const slots = Math.max(2, Math.floor(Math.min(innerWidth, 780) / TAB_MIN_WIDTH));
  const fits = TABS.length <= slots;
  const shown = fits ? TABS : TABS.slice(0, slots - 1), extra = fits ? [] : TABS.slice(slots - 1);
  row.innerHTML = '';
  shown.forEach(([k, label, icon]) => {
    const b = el(`<button>${lucide(icon)}<span>${label}</span></button>`);
    if (k === tab) b.setAttribute('aria-current', 'page');
    b.onclick = () => go(k);
    row.appendChild(b);
  });
  if (extra.length) {
    const inExtra = extra.some(([k]) => k === tab);
    const cur = inExtra ? extra.find(([k]) => k === tab) : null;
    const b = el(`<button aria-haspopup="menu" aria-expanded="false">${lucide(cur ? cur[2] : 'ellipsis')}<span>${cur ? cur[1] : 'More'}</span></button>`);
    if (inExtra) b.setAttribute('aria-current', 'page');
    b.onclick = () => openPopover(b, extra.map(([k, label, icon]) => ({label, icon, current: k === tab, run: () => go(k)})), 'above');
    row.appendChild(b);
  }
}

function render(){
  closePopover(true);
  renderChrome();
  const v = document.getElementById('view');
  v.innerHTML = '';
  PAGES[tab].view(v);
}

function qText(q){
  return `<p style="margin:0 0 4px;font-weight:600">${esc(q.en)}</p>` +
         (showThai ? `<p class="th" style="margin:0">${esc(q.th)}</p>` : '');
}
function optText(o){
  return `${esc(o[1])}` + (showThai ? `<br><span class="th">${esc(o[0])}</span>` : '');
}
const THAI_LETTERS = ['ก','ข','ค','ง'];
function signImg(q, px){
  return q.img ? `<img class="sign" src="${q.img}" width="${px}" height="${px}"
    alt="Thai road sign ${esc(q.code || '')}" style="width:${px}px;height:${px}px">` : '';
}

/* ---------- MOCK EXAM ---------- */
function pool(){ return BANK.filter(q => !(excludeCarOnly && q.car)); }

/* sign options are rebuilt every time the sign is drawn, so repeated papers
   never let you learn "the answer is ค" instead of learning the sign */
const freshen = qs => { qs.forEach(q => { if (q.sign) Object.assign(q, signOpts(q.sign)); }); return qs; };

function buildPaper(onlyIds){
  if (onlyIds) return freshen(shuffle(BANK.filter(q => onlyIds.includes(q.id))).slice(0, TOTAL));
  const p = pool(), out = [];
  for (const c in QUOTA){
    const avail = shuffle(p.filter(q => q.c === c));
    out.push(...avail.slice(0, QUOTA[c]));
  }
  const rest = shuffle(p.filter(q => !out.includes(q)));
  while (out.length < TOTAL && rest.length) out.push(rest.pop());
  return freshen(shuffle(out).slice(0, TOTAL));
}

function startExam(onlyIds){
  const qs = buildPaper(onlyIds);
  exam = { qs, pick: new Array(qs.length).fill(null), i: 0,
           deadline: Date.now() + MINUTES*60000, submitted: false, retry: !!onlyIds };
  render();
}

/* The PDF sits next to index.html, so the link is relative; check.js fails if the file is missing. */
const RES = {pdf:'3.ExamEnglish_6382.pdf', video:'https://youtu.be/HdmqNfGZ9Is'};
const resourcesCard = () => `<div class="card">
  <h2 style="margin-top:0">Official material</h2>

    <span class="sub" style="display:block;margin:2px 0 0">Thai audio, episode 16 of the DLT licence section's series. Opens in a new tab and needs internet.</span></p>
</div>`;

let tick = null;
function viewMock(v){
  clearInterval(tick);
  if (!exam){
    const hist = load();
    const wrongIds = hist.length ? hist[hist.length-1].wrong.map(w=>w.id) : [];
    v.appendChild(el(`<div class="card">
      <h2 style="margin-top:0">Sit a mock paper</h2>
      <p>${TOTAL} questions drawn across all categories, ${MINUTES} minutes, no feedback until you
      submit — the same shape as the DLT touchscreen test. You need <b>${PASS} correct</b> to pass.</p>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="go">Start ${TOTAL}-question mock</button>
        ${wrongIds.length ? `<button class="btn ghost" id="retry">Retry my ${wrongIds.length} wrong from last time</button>` : ''}
      </div>
      <div class="row" style="margin-top:16px">
        <label class="row" style="gap:6px"><input type="checkbox" id="th" ${showThai?'checked':''}> Show Thai alongside English</label>
      </div>
      <div class="row" style="margin-top:6px">
        <label class="row" style="gap:6px"><input type="checkbox" id="co" ${excludeCarOnly?'checked':''}> Leave out car-only questions (clutch, radiator, 4 wheels)</label>
      </div>
      <p class="sub" style="margin-top:14px">Bank: ${pool().length} questions available.</p>
    </div>`));
    v.querySelector('#go').onclick = () => beginExam(null);
    const r = v.querySelector('#retry'); if (r) r.onclick = () => beginExam(wrongIds);
    v.querySelector('#th').onchange = e => { showThai = e.target.checked; };
    v.querySelector('#co').onchange = e => { excludeCarOnly = e.target.checked; render(); };
    v.appendChild(el(resourcesCard()));
    return;
  }
  if (exam.submitted) return viewResult(v);

  const q = exam.qs[exam.i], n = exam.qs.length;
  const answered = exam.pick.filter(x => x !== null).length;
  v.appendChild(el(`<div class="card">
    <div class="row" style="justify-content:space-between">
      <span class="pill">${exam.i+1} / ${n} &nbsp;·&nbsp; ${CATS[q.c][0]}</span>
      <span class="timer" id="clock">--:--</span>
    </div>
    <div class="bar"><i style="width:${(answered/n*100).toFixed(1)}%"></i></div>
    ${q.img ? `<div style="margin:8px 0 14px">${signImg(q,150)}</div>` : ''}
    ${qText(q)}
    <div id="opts"></div>
    <div class="row" style="justify-content:space-between;margin-top:14px">
      <button class="btn ghost" id="prev" ${exam.i===0?'disabled':''}>&larr; Previous</button>
      <div class="row">
        <button class="btn ghost" id="skip">Skip</button>
        ${exam.i===n-1 ? '<button class="btn" id="submit">Submit paper</button>'
                       : '<button class="btn" id="next">Next &rarr;</button>'}
      </div>
    </div>
    <p class="sub" style="margin:10px 0 0">${answered} of ${n} answered.
      ${answered<n ? 'Unanswered questions count as wrong.' : 'All answered.'}</p>
  </div>`));

  const opts = v.querySelector('#opts');
  q.o.forEach((o, k) => {
    const b = el(`<button class="opt" aria-pressed="${exam.pick[exam.i]===k}">
      <b>${THAI_LETTERS[k]}.</b> ${optText(o)}</button>`);
    b.onclick = () => { exam.pick[exam.i] = k;
      if (exam.i < n-1) { exam.i++; render(); } else render(); };
    opts.appendChild(b);
  });
  v.querySelector('#prev').onclick = () => { exam.i--; render(); };
  const nx = v.querySelector('#next'); if (nx) nx.onclick = () => { exam.i++; render(); };
  v.querySelector('#skip').onclick = () => { if (exam.i < n-1) { exam.i++; render(); } };
  const sb = v.querySelector('#submit'); if (sb) sb.onclick = finishExam;

  const clock = v.querySelector('#clock');
  const paint = () => {
    const ms = exam.deadline - Date.now();
    if (ms <= 0) { clearInterval(tick); finishExam(); return; }
    const s = Math.floor(ms/1000);
    clock.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    clock.classList.toggle('low', s < 300);
  };
  paint(); tick = setInterval(paint, 1000);
}

function submit(){
  clearInterval(tick);
  exam.submitted = true;
  const wrong = [], byCat = {};
  exam.qs.forEach((q, i) => {
    byCat[q.c] = byCat[q.c] || {n:0, ok:0};
    byCat[q.c].n++;
    if (exam.pick[i] === q.a) byCat[q.c].ok++;
    else wrong.push({id:q.id, picked: exam.pick[i]});
  });
  const score = exam.qs.length - wrong.length;
  exam.result = {score, of: exam.qs.length, wrong, byCat};
  if (!exam.retry){
    const h = load();
    h.push({ when: new Date().toISOString(), score, of: exam.qs.length,
             byCat, wrong: wrong.map(w => ({id:w.id})) });
    save(h);
  }
  render();
}

/* ---------- numbered pager ---------- */
function pagerHtml(key, total){
  const size = PAGE_SIZE[key], pages = pageCount(total, size);
  if (pages < 2) return '';
  const cur = pageNo[key] = Math.min(Math.max(1, pageNo[key]), pages);
  let prev = 0, nums = '';
  pageWindow(cur, pages).forEach(n => {
    if (n - prev > 1) nums += '<span class="gap">…</span>';
    nums += `<button data-p="${n}" ${n === cur ? 'aria-current="page"' : ''} aria-label="Page ${n}">${n}</button>`;
    prev = n;
  });
  const from = (cur-1)*size + 1, to = Math.min(cur*size, total);
  return `<div class="pager" data-pager="${key}">
    <button data-p="${cur-1}" ${cur === 1 ? 'disabled' : ''}>&lsaquo; Prev</button>${nums}
    <button data-p="${cur+1}" ${cur === pages ? 'disabled' : ''}>Next &rsaquo;</button>
    <span class="count">${from}-${to} of ${total}</span></div>`;
}
function wirePagers(v, key){
  v.querySelectorAll(`[data-pager="${key}"] button`).forEach(b => b.onclick = () => {
    pageNo[key] = +b.dataset.p;
    history.replaceState(navState(), '', key === 'study' ? `#study/${studyCat}/${pageNo[key]}` : `#${key}/${pageNo[key]}`);
    render(); scrollTo(0, 0);
  });
}

function viewPhrases(v){
  v.appendChild(el(`<div class="card"><p style="margin:0">The desk staff will get you through this
  even with no shared language, but these fifteen lines remove almost all of the friction.
  <b>ครับ (khrap)</b> at the end of every sentence is the polite particle for a male speaker —
  use it every time.</p></div>`));

    <thead><tr><th>Thai</th><th>Say it</th><th>Meaning</th></tr></thead>
    <tbody>${PHRASES.map(([t,r,e]) =>
      `<tr><td class="th" style="font-size:15px">${t}</td>

/* ---------- HISTORY ---------- */
function viewHistory(v){
  const h = load();
  if (!h.length){
    v.appendChild(el('<div class="card"><p style="margin:0">No attempts recorded yet. Sit a mock paper and it will show up here.</p></div>'));
    return;
  }
  const W = 700, H = 190, P = 34;
  const xs = i => P + (h.length === 1 ? (W-2*P)/2 : i*(W-2*P)/(h.length-1));
  const ys = s => H - P - (s/50)*(H-2*P);
  const line = h.map((a,i) => `${xs(i).toFixed(1)},${ys(a.score/a.of*50).toFixed(1)}`).join(' ');
  v.appendChild(el(`<div class="card">
    <h2 style="margin-top:0">Score history <span class="pill">${h.length} attempt${h.length>1?'s':''}</span></h2>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="overflow:visible">
      <line x1="${P}" y1="${ys(45)}" x2="${W-P}" y2="${ys(45)}" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${W-P+4}" y="${ys(45)+4}" font-size="11" fill="var(--ok)">45 pass</text>
      <line x1="${P}" y1="${ys(0)}" x2="${W-P}" y2="${ys(0)}" stroke="var(--line)"/>
      <text x="${P-6}" y="${ys(50)+4}" font-size="11" fill="var(--dim)" text-anchor="end">50</text>
      <text x="${P-6}" y="${ys(0)+4}"  font-size="11" fill="var(--dim)" text-anchor="end">0</text>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
      ${h.map((a,i) => {
        const s = a.score/a.of*50;
        return `<circle cx="${xs(i).toFixed(1)}" cy="${ys(s).toFixed(1)}" r="4.5"
                 fill="${s>=45?'var(--ok)':'var(--bad)'}"/>
                <text x="${xs(i).toFixed(1)}" y="${ys(s)-10}" font-size="11" fill="var(--dim)"
                 text-anchor="middle">${a.score}</text>`; }).join('')}
    </svg>
    <p class="sub" style="margin:4px 0 0">Scores normalised to a 50-question paper. Aim for three
    consecutive papers at 47+ before you book the test — 45 leaves no margin for a badly worded
    question on the day.</p>
  </div>`));

  const cats = Object.keys(CATS);
  const agg = {};
  cats.forEach(c => agg[c] = {n:0, ok:0});
  h.forEach(a => { for (const c in (a.byCat||{})) {
    if (!agg[c]) agg[c] = {n:0, ok:0};
    agg[c].n += a.byCat[c].n; agg[c].ok += a.byCat[c].ok; } });
  const weak = cats.filter(c => agg[c].n).sort((x,y) => agg[x].ok/agg[x].n - agg[y].ok/agg[y].n);
  v.appendChild(el(`<div class="card">
    <h2 style="margin-top:0">Weakest categories, all attempts pooled</h2>
    <table><tbody>${weak.map(c => {
      const b = agg[c], pct = b.ok/b.n*100;
      return `<tr><td>${CATS[c][0]}</td><td class="mono" style="width:70px">${b.ok}/${b.n}</td>
        <td class="mono" style="width:50px">${pct.toFixed(0)}%</td>
        <td style="width:40%"><div class="bar" style="margin:0"><i style="width:${pct}%;
          background:${pct>=90?'var(--ok)':pct>=70?'var(--warn)':'var(--bad)'}"></i></div></td></tr>`;
    }).join('')}</tbody></table>
    <p class="sub">Anything under 90% here will cost you the paper. Go to Study and read that
    category end to end.</p>
  </div>`));

  v.appendChild(el(`<div class="card" style="padding:8px 16px"><table>
    <thead><tr><th>#</th><th>When</th><th>Score</th><th>%</th><th></th></tr></thead>
    <tbody>${h.map((a,i) => {
      const pct = a.score/a.of*100, ok = pct >= 90;
      return `<tr><td class="mono">${i+1}</td>
        <td>${new Date(a.when).toLocaleString()}</td>
        <td class="mono">${a.score}/${a.of}</td>
        <td class="mono">${pct.toFixed(0)}%</td>
        <td class="${ok?'ok':'bad'}" style="font-weight:600">${ok?'pass':'fail'}</td></tr>`;
    }).reverse().join('')}</tbody></table></div>`));

}

/* ---------- self-check: run with ?selftest ---------- */
function selftest(){
  const errs = [];
  BANK.forEach(q => {
    if (!q.o || q.o.length !== 4) errs.push(`${q.id}: needs exactly 4 options`);
    if (!(q.a >= 0 && q.a < 4)) errs.push(`${q.id}: answer index out of range`);
    if (!q.en || !q.th || !q.w) errs.push(`${q.id}: missing en / th / why`);
    q.o.forEach((o,k) => { if (!o[0] || !o[1]) errs.push(`${q.id}.${k}: option missing a language`); });
    const seen = new Set(q.o.map(o => o[1]));
    if (seen.size !== 4) errs.push(`${q.id}: duplicate English options`);
  });
  /* every sign must carry artwork, a code and a family */
  SIGNS.forEach(s => {
    if (!s.img || !/^signs\/[a-z0-9-]+\.png$/.test(s.img)) errs.push(`${s.code}: bad img path ${s.img}`);
    if (!s.code || !s.th || !s.en || !s.w || !s.fam) errs.push(`${s.code}: missing a field`);
  });
  /* paging: the number window keeps first, last and current; the pages tile every list in order */
  for (let pages = 1; pages <= 40; pages++) for (let cur = 1; cur <= pages; cur++) {
    const w = pageWindow(cur, pages);
    if (![1, cur, pages].every(n => w.includes(n))) errs.push(`pageWindow(${cur},${pages}) lost an anchor page`);
    if (w.length > 5 || w.some((n, i) => i && n <= w[i-1])) errs.push(`pageWindow(${cur},${pages}) is unsorted or too long`);
  }
  const tile = (arr, size) => { const out = []; for (let p = 1; p <= pageCount(arr.length, size); p++) out.push(...pageSlice(arr, p, size)); return out; };
  [...Object.keys(CATS).map(c => ['Study ' + c, BANK.filter(q => q.c === c), PAGE_SIZE.study]),
   ['Signs', SIGNS, PAGE_SIZE.signs]].forEach(([name, arr, size]) => {
    const t = tile(arr, size);
    if (t.length !== arr.length || t.some((x, i) => x !== arr[i])) errs.push(`${name}: pages do not tile the list`);
  });
  /* gallery-only signs must be visible in the gallery but never asked */
  const asked = new Set(BANK.filter(q => q.sign).map(q => q.code));
  SIGNS.filter(s => s.gallery).forEach(s => {
    if (asked.has(s.code)) errs.push(`${s.code}: gallery-only sign was turned into a question`);
  });
  SIGNS.filter(s => !s.gallery).forEach(s => {
    if (!asked.has(s.code)) errs.push(`${s.code}: askable sign is missing from the bank`);
  });
  /* every distractor group must be able to supply 3 same-group wrong answers, or the
     question leaks its answer by offering obviously unrelated options */
  Object.keys(SIGN_GRP).forEach(g => {
    const distinct = new Set(SIGN_GRP[g].map(s => s.en)).size;
    if (distinct < 4) errs.push(`distractor group "${g}" has only ${distinct} distinct meanings, needs 4`);
  });
  /* regenerated sign options must always be 4 distinct choices containing the right one,
     and all three distractors must come from the same group */
  for (let t = 0; t < 600; t++){
    const s = SIGNS[(Math.random()*SIGNS.length)|0], r = signOpts(s);
    if (r.o.length !== 4) errs.push(`${s.code}: ${r.o.length} options`);
    if (new Set(r.o.map(o => o[1])).size !== 4) errs.push(`${s.code}: duplicate option text`);
    if (r.o[r.a][1] !== s.en) errs.push(`${s.code}: answer index points at "${r.o[r.a][1]}"`);
    const foreign = r.o.filter(o => o[1] !== s.en)
      .filter(o => !SIGN_GRP[gkey(s)].some(x => x.en === o[1]));
    if (foreign.length) errs.push(`${s.code}: ${foreign.length} distractor(s) from outside its group`);
  }
  /* a paper must be exactly TOTAL questions, all distinct, and carry no car-only items */
  for (let t = 0; t < 200; t++){
    const p = buildPaper(null);
    if (p.length !== TOTAL) errs.push(`paper ${t}: ${p.length} questions, expected ${TOTAL}`);
    if (new Set(p.map(q => q.id)).size !== p.length) errs.push(`paper ${t}: duplicate question`);
    if (p.some(q => q.car)) errs.push(`paper ${t}: contains a car-only question`);
    p.forEach(q => { if (q.sign && q.o[q.a][1] !== q.sign.en)
      errs.push(`paper ${t}: freshened sign ${q.code} lost its answer`); });
  }
  /* end to end: sit a paper, answer it, check the scoring and the 45/50 gate.
     localStorage is snapshotted so a self-test never pollutes real attempt history. */
  let e2e = 0;
  if (typeof document.createElement === 'function' && document.getElementById('view')){
    const snapshot = localStorage.getItem(KEY);
    try {
      [0, 5, 6, 50].forEach(nWrong => {
        startExam(null);
        exam.qs.forEach((q, i) => exam.pick[i] = q.a);
        for (let i = 0; i < nWrong; i++) exam.pick[i] = (exam.qs[i].a + 1) % 4;
        submit();
        const r = exam.result, expect = TOTAL - nWrong;
        if (r.score !== expect) errs.push(`e2e ${nWrong} wrong: score ${r.score}, expected ${expect}`);
        if (r.wrong.length !== nWrong) errs.push(`e2e ${nWrong} wrong: listed ${r.wrong.length}`);
        if ((r.score >= PASS) !== (nWrong <= 5)) errs.push(`e2e ${nWrong} wrong: pass gate wrong`);
        const seen = Object.keys(r.byCat).reduce((a, c) => a + r.byCat[c].n, 0);
        if (seen !== TOTAL) errs.push(`e2e ${nWrong} wrong: byCat totals ${seen}, expected ${TOTAL}`);
        e2e++;
      });
      /* unanswered must count as wrong, not as correct */
      startExam(null);
      exam.qs.forEach((q, i) => exam.pick[i] = q.a);
      exam.pick[0] = null; exam.pick[1] = null;
      submit();
      if (exam.result.score !== TOTAL - 2) errs.push(`e2e: unanswered scored ${exam.result.score}, expected ${TOTAL-2}`);
      e2e++;
    } finally {
      exam = null;
      if (snapshot === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, snapshot);
    }
  }
  const out = errs.length ? 'FAIL\n' + errs.join('\n')
    : `PASS — ${BANK.length} questions, 200 papers built clean, ${e2e} end-to-end papers scored correctly`;
  document.body.innerHTML = `<pre style="padding:20px;white-space:pre-wrap;font:13px ui-monospace,monospace">${esc(out)}</pre>`;
  console.log(out);
}

const fromHash = location.hash.slice(1).split('/')[0];
const hashParts = location.hash.slice(1).split('/');
const fromCat = fromHash === 'study' && CATS[hashParts[1]] ? hashParts[1] : null;   // #study/trf/2
const fromPage = +hashParts[fromCat ? 2 : 1] || 1;       // #signs/3 opens page 3
if (TABS.some(([k]) => k === fromHash)) tab = fromHash;
if (pageNo[fromHash] !== undefined) pageNo[fromHash] = fromPage;
if (fromCat) studyCat = fromCat;
history.replaceState({tab, d:0, sub: fromHash.startsWith('exam') ? 'exam' : fromCat ? 'cat' : undefined,
  cat: fromCat || undefined}, '', location.hash || '#' + tab);
if (location.search.includes('selftest')) selftest();
/* #exam = straight into a fresh paper. #exam-sign, #exam-trf, … = one category
   under exam conditions; those are not written to history. */
else if (fromHash === 'exam') startExam(null);
else if (fromHash.startsWith('exam-') && CATS[fromHash.slice(5)])
  startExam(BANK.filter(q => q.c === fromHash.slice(5)).map(q => q.id));
else render();
</script>
